# The checks every push and pull request must pass: types, unit tests, the silent end-to-end tests in Chromium and
# WebKit (the engine the Mac app runs on), and the Rust side's formatting and lints. The release build (build.yml)
# runs these first too.
#
# Linux runners on purpose: only the release build needs a Mac. Nothing here makes a sound: UI tests use the silent engine, audio tests render offline into memory.
name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

concurrency:
  group: checks-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Types, unit and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (silent)
        run: npm run e2e

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rust:
    name: Rust format and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app embeds the built frontend at compile time, so it has to exist before the Rust side compiles.
      - name: Frontend
        run: |
          npm ci
          npx vite build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lints
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
