# Builds Nadilo for macOS, and only macOS: one universal app that runs on both Apple silicon and Intel Macs. Attaches
# the DMG and its SHA-256 checksum to a draft release.
#
# The DMG is attached twice: once with the version in its name, and once as Nadilo.dmg. The website links to
# https://github.com/tonestruments/nadilo/releases/latest/download/Nadilo.dmg, which is always the DMG of the newest
# published release that is not a draft or a pre-release, so the website never changes for a new version.
#
# Push a tag like v0.4.0 (it must match the version in package.json, tauri.conf.json and Cargo.toml), or run it from
# the Actions tab ("Run workflow"). The checks in checks.yml run first; nothing is built if they fail.
#
# Not signed yet. Signing and notarization come with the Developer ID certificate: tauri-action signs, notarizes and
# staples when the APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and
# APPLE_TEAM_ID secrets are passed to it. Do not pass them before they exist: an empty certificate fails the build.
# Nadilo.dmg is copied from the DMG that tauri-action made, after it has signed it, so a signed build needs no change
# here. Once the builds are signed, take the Open Anyway steps out of the release notes and the website.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: One version everywhere, and the tag says it
        id: version
        run: |
          app=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json $app, tauri.conf.json $conf, Cargo.toml $cargo"
          [ "$app" = "$conf" ] && [ "$app" = "$cargo" ] || { echo "::error::The versions differ"; exit 1; }
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$app" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version $app"; exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="nadilo-v$app"; fi
          echo "version=$app" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Nadilo Desktop v__VERSION__'
          releaseDraft: true
          args: --target universal-apple-darwin

      # The Mac app must hold both slices, carry the right version, and link nothing but the system's own libraries.
      - name: Check the Mac app
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Nadilo Desktop.app"
          exe="$app/Contents/MacOS/nadilo"
          lipo -info "$exe"
          lipo "$exe" -verify_arch x86_64 arm64
          plist="$app/Contents/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "CFBundleShortVersionString $short, CFBundleVersion $build"
          [ "$short" = "${{ steps.version.outputs.version }}" ] || { echo "::error::Info.plist says $short"; exit 1; }
          # One architecture at a time: on a universal binary, otool -L prints a header line for each slice, and a
          # header is not a library.
          for arch in x86_64 arm64; do
            if otool -arch "$arch" -L "$exe" | tail -n +2 | grep -v -E '^\s+(/System/Library/|/usr/lib/)'; then
              echo "::error::The $arch app links a library that is not part of macOS"; exit 1
            fi
          done

      - name: Checksums
        id: sums
        env:
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          SUMS: out/SHA256SUMS-${{ runner.os }}.txt
        run: |
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            fs.mkdirSync("out", { recursive: true });
            const lines = [];
            const add = (p, name) => {
              fs.copyFileSync(p, path.join("out", name));
              lines.push(crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex") + "  " + name);
            };
            const dmgs = [];
            for (const p of JSON.parse(process.env.PATHS)) {
              if (!fs.statSync(p).isFile()) continue;
              add(p, path.basename(p));
              if (p.endsWith(".dmg")) dmgs.push(p);
            }
            if (dmgs.length !== 1) { console.error("::error::Expected one DMG, found " + dmgs.length); process.exit(1); }
            add(dmgs[0], "Nadilo.dmg");
            fs.writeFileSync(process.env.SUMS, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
          echo "file=$SUMS" >> "$GITHUB_OUTPUT"

      - name: Attach Nadilo.dmg and the checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" out/Nadilo.dmg "${{ steps.sums.outputs.file }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: nadilo-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: out/
          retention-days: 30
