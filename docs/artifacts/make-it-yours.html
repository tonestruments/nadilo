<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make It Yours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..800&display=swap">
<style>
/* A working prototype of Nadilo School's next step, drawn in the app's own look (Stage Daylight, indigo cloth, kinari
   thread), one theme like the app. After a world is rebuilt, one more level: change it, hear what the change did, keep
   it. Everything the player changed is gold. Sound is the shared synth of docs/artifacts (nadilo-sound.js). */
:root {
  --ink: oklch(27.5% 0.064 270.6);
  --ink-hover: color-mix(in oklch, var(--ink), white 12%);
  --on-ink: oklch(98.4% 0.006 271);
  --mute: oklch(47.1% 0.054 269.6);
  --dim: oklch(62.6% 0.048 271);
  --card: oklch(100% 0 none);
  --line: color-mix(in oklch, var(--ink) 14%, transparent);
  --line-strong: color-mix(in oklch, var(--ink) 30%, transparent);
  --wash: color-mix(in oklch, var(--ink) 6%, transparent);
  --wash-strong: color-mix(in oklch, var(--ink) 11%, transparent);
  --page-top: oklch(96.1% 0.013 266.7);
  --page-bottom: oklch(93.6% 0.019 264.3);
  --gold: oklch(80% 0.14 82);
  --gold-ink: oklch(55% 0.12 76);
  --star: oklch(75.3% 0.144 76.4);
  --ok: oklch(56.7% 0.112 157.5);
  --cloth: oklch(30.2% 0.092 270.1);
  --cloth-deep: oklch(25.5% 0.08 270.4);
  --thread: oklch(92.6% 0.031 88.4);
  --shadow: 0 1px 2px oklch(27.5% 0.064 270.6 / 0.06), 0 16px 40px -18px oklch(27.5% 0.064 270.6 / 0.38);
  --kick: oklch(73.4% 0.166 35.4);
  --snare: oklch(82.4% 0.14 80.8);
  --hat: oklch(76.2% 0.106 199.8);
  --bass: oklch(72.8% 0.141 315.6);
  --chords: oklch(74.5% 0.122 160.4);
  --melody: oklch(76% 0.12 275);
  --label: 6.25rem;
  --font: 'Urbanist', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
body {
  margin: 0; min-block-size: 100svh; font: 500 15px/1.4 var(--font); color: var(--ink);
  background: linear-gradient(180deg, var(--page-top), var(--page-bottom)); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
p, h1, h2 { margin: 0; }
.c-kick { --c: var(--kick); } .c-snare { --c: var(--snare); } .c-hat { --c: var(--hat); }
.c-bass { --c: var(--bass); } .c-chords { --c: var(--chords); } .c-melody { --c: var(--melody); }
svg.i { inline-size: 1.15em; block-size: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* -- the page: a line of what this is, the four steps, the screens -- */
.page { inline-size: min(78rem, 100% - 2rem); margin-inline: auto; padding-block: 1.75rem 3rem; display: grid; row-gap: 1.1rem; }
.intro { display: grid; row-gap: 0.35rem; justify-items: center; text-align: center; }
.intro .kicker { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-ink); }
.intro h1 { font-size: clamp(1.7rem, 1.2rem + 1.6vw, 2.5rem); font-weight: 780; letter-spacing: -0.02em; }
.intro p { color: var(--mute); font-size: 1.05rem; max-inline-size: 46rem; }
.loop { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0.45rem; margin-block-start: 0.35rem; }
.loop span { padding: 0.3rem 0.8rem; border-radius: 99px; background: var(--wash); font-weight: 700; color: var(--mute); }
.loop span.new { background: var(--gold); color: var(--ink); }
.loop i { font-style: normal; color: var(--dim); }
.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.3rem; padding: 0.25rem; border-radius: 99px; background: var(--wash); justify-self: center; }
.tab { block-size: 2.4rem; padding-inline: 1rem; border-radius: 99px; font-weight: 700; color: var(--mute); white-space: nowrap; }
.tab[aria-selected='true'] { background: var(--ink); color: var(--on-ink); }
.why { text-align: center; color: var(--mute); font-size: 0.92rem; max-inline-size: 52rem; justify-self: center; }
.why b { color: var(--ink); }

/* -- the window: the app, at 1440 x 900, scaled to fit -- */
.window {
  position: relative; inline-size: 100%; aspect-ratio: 1440 / 900; border-radius: 14px; overflow: clip;
  background: linear-gradient(180deg, #eef2fb 0%, #e3e9f5 80%); box-shadow: 0 30px 70px -30px oklch(27.5% 0.064 270.6 / 0.45), 0 0 0 1px var(--line);
  container-type: inline-size;
}
.app {
  position: absolute; inset: 0 auto auto 0; inline-size: 1440px; block-size: 900px; transform-origin: 0 0;
  transform: scale(calc(100cqi / 1440px)); display: grid; grid-template-rows: 44px minmax(0, 1fr);
}
@supports not (transform: scale(calc(100cqi / 1440px))) { .app { transform: scale(0.82); } }

.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-inline: 16px; }
.lights { display: flex; gap: 8px; padding-inline-start: 4px; align-items: center; }
.lights i { inline-size: 12px; block-size: 12px; border-radius: 50%; background: #ec6a5e; }
.lights i:nth-child(2) { background: #f4bf4f; } .lights i:nth-child(3) { background: #61c554; }
.tb-left { display: flex; align-items: center; gap: 18px; }
.tb-btns { display: flex; gap: 2px; }
.bar-btn { block-size: 28px; padding: 0 11px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; line-height: 1; color: var(--mute); }
.bar-btn svg.i { inline-size: 16px; block-size: 16px; margin-inline-start: -3px; }
.tb-right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--mute); padding-inline: 8px; }
.status i { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--line-strong); }
.status.on i { background: var(--ok); }
.journey { display: flex; align-items: center; gap: 10px; }
.journey .arrow { color: var(--dim); display: grid; }
.journey b { font-size: 15px; font-weight: 750; margin-inline-end: 4px; }
.jn { inline-size: 13px; block-size: 13px; border-radius: 50%; background: var(--world); }
.jn.mine { border-radius: 3px; transform: rotate(45deg) scale(0.85); background: var(--gold); }
.jn.here { box-shadow: 0 0 0 2px var(--page-top), 0 0 0 3.5px var(--ink); }

.school {
  display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  row-gap: 10px; padding: 0 0 16px;
}
.school > * { grid-column: 2; }
.head { display: grid; justify-items: center; padding-block-start: 14px; }
.head h1 { font-size: 42px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.08; margin-block-end: 6px; }
.goal { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 11px; inline-size: 100%; block-size: 40px; color: var(--mute); }
.goal .side { display: flex; align-items: center; gap: 9px; }
.goal .side:first-child { justify-content: flex-end; }
.goal .text { font-size: 19px; font-weight: 550; white-space: nowrap; }
.goal.named .text { font-size: 16px; color: var(--ink); }
.goal .text b { color: var(--gold-ink); font-weight: 800; }
.tick { inline-size: 26px; block-size: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--ink); }
.changes { display: inline-flex; align-items: center; gap: 6px; block-size: 26px; padding-inline: 10px; border-radius: 99px; background: color-mix(in oklch, var(--gold) 30%, transparent); font-size: 13px; font-weight: 750; color: var(--ink); }
.changes[data-none] { background: var(--wash); color: var(--mute); }

.stripwrap { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; }
.stripwrap > .strip { grid-column: 2; }
.sarrow { inline-size: 36px; block-size: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); }
.sarrow:first-child { justify-self: end; margin-inline-end: 9px; } .sarrow:last-child { justify-self: start; margin-inline-start: 9px; }
.sarrow:disabled { opacity: 0.3; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; block-size: 80px; }
.tile {
  position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); row-gap: 3px; padding: 7px 11px 8px; border-radius: 14px;
  background: var(--cloth); color: var(--thread); box-shadow: var(--shadow); text-align: start; overflow: clip;
}
.tile[data-locked] { background: var(--cloth-deep); cursor: default; }
.tile[aria-current] { outline: 2.5px solid var(--ink); outline-offset: 3px; }
.tile-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 750; }
.patch { inline-size: 18px; block-size: 18px; border-radius: 5px; background: var(--gold); transform: rotate(45deg) scale(0.7); visibility: hidden; }
.tile[data-changed] .patch { visibility: visible; }
.mini { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 0.7fr)) repeat(3, minmax(0, 1.3fr)); align-items: center; }
.mini > i { display: block; }
.m-line { block-size: 3px; margin-inline: 1px; border-radius: 99px; background: var(--c); }
.m-chord { block-size: 4px; border-radius: 99px; grid-column: 1 / -1; }
.m-hit { justify-self: center; background: var(--c); }
.m-kick { inline-size: 8px; block-size: 4px; border-radius: 99px; }
.m-snare { inline-size: 7px; block-size: 7px; background: linear-gradient(45deg, transparent 38%, var(--c) 38% 62%, transparent 62%), linear-gradient(-45deg, transparent 38%, var(--c) 38% 62%, transparent 62%); }
.m-hat { inline-size: 2px; block-size: 7px; border-radius: 1px; transform: rotate(32deg); }
.mini .gold { outline: 1.5px solid var(--gold); outline-offset: 1.5px; border-radius: 2px; }
.needle { position: absolute; inset-block: 6px; inline-size: 2px; border-radius: 1px; background: var(--thread); opacity: 0; inset-inline-start: calc(11px + var(--at, 0) * (100% - 22px)); }
.tile[data-now] .needle { opacity: 1; }

.tools { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 16px; block-size: 44px; }
.takes { display: flex; align-items: center; gap: 5px; padding: 4px 5px 4px 13px; border-radius: 99px; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--gold-ink) 45%, transparent); }
.takes-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--mute); margin-inline-end: 4px; }
.chip { block-size: 34px; padding-inline: 13px; border-radius: 99px; background: var(--wash); font-weight: 750; font-size: 14px; }
.edit { display: flex; gap: 6px; justify-self: end; }
.sbtn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; block-size: 38px; padding-inline: 14px; border-radius: 99px; font-weight: 650; font-size: 13.5px; color: var(--mute); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.sbtn:disabled { opacity: 0.4; }
.sbtn.primary { block-size: 44px; padding-inline: 19px; font-size: 16px; background: var(--ink); color: var(--on-ink); box-shadow: none; }
.sbtn.gold { block-size: 44px; padding-inline: 19px; font-size: 16px; background: var(--gold); color: var(--ink); box-shadow: none; }

.cloth { position: relative; border-radius: 22px; padding: 18px 22px; color: var(--thread); box-shadow: var(--shadow);
  background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in oklch, var(--thread) 3%, transparent) 7px 8px), var(--cloth); min-block-size: 0;
  display: grid; grid-template-rows: minmax(0, 1fr); }
.cloth > * { min-block-size: 0; }
.beatno { display: grid; place-items: center; font-size: 15px; font-weight: 800; color: color-mix(in oklch, var(--thread) 72%, transparent); }
.beatno[data-sub] { font-size: 12.5px; font-weight: 650; color: color-mix(in oklch, var(--thread) 42%, transparent); }
.beatno[data-now] { color: var(--thread); }
.name { font-size: 19px; font-weight: 750; color: var(--thread); }
.name.small { font-size: 13px; font-weight: 700; color: color-mix(in oklch, var(--thread) 55%, transparent); }

/* drums */
.drumbar { display: grid; grid-template-rows: 26px repeat(3, minmax(0, 1fr)); row-gap: 9px; }
.lane { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); column-gap: 10px; align-items: center; }
.beats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 16px; block-size: 100%; align-items: center; }
.beat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 4px; block-size: 100%; align-items: center; }
.pad { position: relative; display: grid; place-items: center; block-size: min(100%, 84px); border-radius: 13px; color: var(--c); background: color-mix(in oklch, var(--thread) 7%, transparent); }
.beat > .pad:first-child { background: color-mix(in oklch, var(--thread) 12%, transparent); }
.pad[data-now] { background: color-mix(in oklch, var(--thread) 22%, transparent); }
.pad[data-on] { background: color-mix(in oklch, var(--c) 24%, transparent); }
.pad[data-on][data-now] { background: color-mix(in oklch, var(--c) 40%, transparent); }
.pad[data-gold] { box-shadow: inset 0 0 0 2.5px var(--gold); }
.pad[data-gone] { box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--gold) 55%, transparent); }
.pad[data-gone]::after { content: ''; position: absolute; inset: 30% 30%; border: 2px dashed color-mix(in oklch, var(--gold) 70%, transparent); border-radius: 50%; }
.stitch { inline-size: min(70%, 40px); }

/* bass and tune */
.notebar { display: grid; grid-template-rows: 26px 22px minmax(0, 1fr); row-gap: 7px; }
.row { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); column-gap: 10px; align-items: center; }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 8px; }
.cols .beatno { justify-content: start; padding-inline-start: 10px; }
.ctx-mood { block-size: 8px; border-radius: 99px; }
.ladder { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); column-gap: 10px; min-block-size: 0; }
.heights { display: grid; grid-template-rows: repeat(6, minmax(0, 1fr)); row-gap: 5px; }
.height { display: flex; align-items: center; }
.height i { inline-size: calc(9px + var(--d) * 14px); aspect-ratio: 1; border-radius: 50%; background: color-mix(in oklch, var(--c) 85%, transparent); margin-inline-start: calc((23px - var(--d) * 14px) / 2); }
.height[data-home] i { box-shadow: 0 0 0 2.5px var(--cloth), 0 0 0 4.5px var(--thread); }
.cells { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); column-gap: 8px; row-gap: 5px; touch-action: none; cursor: pointer; }
.cell { border-radius: 10px; background: color-mix(in oklch, var(--thread) 6%, transparent); }
.cell[data-now] { background: color-mix(in oklch, var(--thread) 19%, transparent); }
.cells[data-locked] .cell { background: color-mix(in oklch, var(--thread) 3%, transparent); }
.cells[data-locked] { cursor: default; }
.note { pointer-events: none; z-index: 1; align-self: center; display: flex; align-items: center; block-size: 52%; margin-inline: 3px; border-radius: 99px; background: var(--c); }
.note[data-gold] { box-shadow: 0 0 0 3px var(--gold); }
.note[data-gone] { background: transparent; outline: 2px dashed color-mix(in oklch, var(--gold) 75%, transparent); outline-offset: -2px; z-index: 0; }
.note[data-gone] .knot { visibility: hidden; }
.note[data-hit] { filter: brightness(1.3); }
.knot { inline-size: 15px; aspect-ratio: 1; border-radius: 50%; margin-inline-start: 5px; background: var(--thread); box-shadow: 0 0 0 2.5px color-mix(in oklch, var(--c), black 30%); }

/* colour */
.chordbar { display: grid; grid-template-columns: var(--label) minmax(0, 1fr); grid-template-rows: 26px minmax(0, 1fr) 24px auto; column-gap: 10px; row-gap: 8px; }
.chordbar > * { grid-column: 2; }
.chordbar > .name { grid-column: 1; grid-row: 1; }
.chordbar > .name.small { grid-row: 3; align-self: center; }
.chordbar .ruler { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.chordbar .ruler .beatno { justify-content: start; padding-inline-start: 10px; }
.block { border-radius: 19px; background: repeating-linear-gradient(90deg, transparent 0 13px, color-mix(in oklch, white 14%, transparent) 13px 15px), var(--mood); box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--mood), black 20%); }
.block[data-gold] { box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--mood), black 20%), 0 0 0 4px var(--cloth), 0 0 0 7px var(--gold); }
.under { position: relative; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); align-items: end; }
.bassline { block-size: 4px; border-radius: 99px; background: var(--bass); margin-block-end: calc(var(--h) * 16px); margin-inline: 2px; opacity: 0.75; }
.bassline[data-gold] { opacity: 1; box-shadow: 0 0 0 2px var(--gold); }
.palette { display: flex; justify-content: center; gap: 16px; padding-block: 4px 2px; }
.swatch { inline-size: 46px; block-size: 46px; border-radius: 50%; background: var(--mood); box-shadow: inset 0 0 0 2px color-mix(in oklch, var(--mood), black 18%); }
.swatch[aria-checked='true'] { box-shadow: 0 0 0 3px var(--cloth), 0 0 0 5.5px var(--thread); }
.swatch[data-song]::after { content: ''; display: block; inline-size: 6px; block-size: 6px; border-radius: 50%; background: var(--thread); margin: 54px auto 0; opacity: 0.6; }

/* the dock */
.dock { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 16px; block-size: 72px; }
.listens { display: flex; align-items: center; gap: 8px; }
.ab, .scope { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 99px; background: var(--wash); }
.seg { display: inline-flex; align-items: center; gap: 6px; block-size: 37px; padding-inline: 13px; border-radius: 99px; font-weight: 750; font-size: 14.5px; color: var(--mute); white-space: nowrap; }
.ab .seg { font-size: 16px; padding-inline: 15px; }
.ab .seg[aria-checked='true'] { background: var(--ink); color: var(--on-ink); }
.scope { padding-inline-start: 10px; gap: 2px; color: var(--mute); }
.scope .seg { font-size: 13.5px; }
.scope .seg[aria-checked='true'] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px oklch(27.5% 0.064 270.6 / 0.12); }
.toggle { block-size: 43px; padding-inline: 13px 15px; box-shadow: inset 0 0 0 1px var(--line); }
.toggle[aria-pressed='true'] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.transport { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; column-gap: 10px; }
.transport > :first-child { justify-self: end; } .transport > :last-child { justify-self: start; }
.play { inline-size: 60px; block-size: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); }
.play svg { inline-size: 26px; block-size: 26px; fill: currentColor; stroke: none; }
.way { display: flex; justify-content: flex-end; gap: 8px; }

/* the end: the whole song, yours against the song's */
.school.ending { grid-template-rows: minmax(0, 1fr); }
.end { grid-column: 1 / -1; display: grid; align-content: center; justify-items: center; row-gap: 14px; padding-inline: 48px; text-align: center; }
.end .kicker { font-size: 13px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-ink); }
.end h1 { font-size: 50px; font-weight: 750; letter-spacing: -0.025em; line-height: 1.08; }
.end .line { font-size: 19px; color: var(--mute); }
.player { inline-size: 760px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 24px; padding: 17px 24px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); margin-block-start: 10px; }
.ribbon { position: relative; block-size: 52px; border-radius: 14px; padding-inline: 14px; background: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in oklch, var(--thread) 4%, transparent) 7px 8px), var(--cloth); }
.ribbon .sewn { position: absolute; inset-block: 50% auto; inset-inline-start: 14px; block-size: 2.5px; translate: 0 -50%; inline-size: calc(var(--p, 0) * (100% - 28px)); background: repeating-linear-gradient(90deg, var(--thread) 0 12px, transparent 12px 19px); }
.ribbon .head-mark { position: absolute; inset-block: 8px; inline-size: 5.6px; border-radius: 99px; background: var(--thread); inset-inline-start: calc(14px + var(--p, 0) * (100% - 28px) - 2.8px); }
.ribbon .gold-mark { position: absolute; inset-block-end: 6px; block-size: 4px; border-radius: 99px; background: var(--gold); }
.time { font-weight: 700; color: var(--mute); font-variant-numeric: tabular-nums; }
.map { display: grid; grid-template-columns: auto repeat(4, 150px); gap: 6px 8px; align-items: center; margin-block-start: 6px; }
.map .rn { font-size: 13px; font-weight: 750; color: var(--mute); text-align: end; padding-inline-end: 6px; }
.map .bn { font-size: 12px; font-weight: 750; color: var(--dim); }
.map .cell2 { block-size: 26px; border-radius: 8px; background: var(--cloth); display: grid; place-items: center; }

@media (hover: hover) and (pointer: fine) {
  .tab:not([aria-selected='true']):hover, .chip:hover, .sbtn:not(.primary):not(.gold):not(:disabled):hover, .sarrow:not(:disabled):hover,
  .seg:not([aria-checked='true']):not([aria-pressed='true']):hover, .bar-btn:hover { background: var(--wash-strong); color: var(--ink); }
  .play:hover, .sbtn.primary:hover { background: var(--ink-hover); }
  .tile:not([data-locked]):not([aria-current]):hover { outline: 2px solid var(--line-strong); outline-offset: 3px; }

  .swatch:hover { transform: scale(1.06); }
}
:is(.tab, .chip, .sbtn, .seg, .play, .tile, .swatch, .sarrow):active:not(:disabled) { transform: scale(0.97); }

}

<main class="page">
  <header class="intro">
    <p class="kicker">Nadilo School &middot; a prototype</p>
    <h1>Make it yours</h1>
    <p>Each world ends with one more level. The song stays the reference, but the question changes: not &ldquo;does mine match?&rdquo; but &ldquo;what did my change do?&rdquo; Everything you change is gold.</p>
    <div class="loop" aria-label="The loop"><span>Hear</span><i>&rarr;</i><span>Rebuild</span><i>&rarr;</i><span class="new">Change</span><i>&rarr;</i><span class="new">Own</span></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Screens" id="tabs"></nav>
  <div class="window"><div class="app" id="app"></div></div>
  <p class="why" id="why"></p>
</main>

<script src="nadilo-sound.js"></script>
<script>
(function () {
  'use strict';
  const NS = window.NadiloSound;
  const STEPS = 16, BARS = 4;

  // -- the song: Nadilo School's first song, note for note (src/school/song.ts) --
  const hits = (xs) => Array.from({ length: STEPS }, (_, i) => xs.includes(i));
  const EIGHTHS = [0, 2, 4, 6, 8, 10, 12, 14];
  const groove = () => ({ kick: hits([0, 4, 8, 12]), snare: hits([4, 12]), hat: hits(EIGHTHS) });
  const turn = () => ({ kick: hits([0, 4, 8, 12]), snare: hits([4, 12, 14, 15]), hat: hits(EIGHTHS) });
  const n = (at, len, row) => ({ at, len, row });
  const Bn = { C: 0, Eb: 1, F: 2, G: 3, Ab: 4, Bb: 5 }, Tn = { G: 0, Bb: 1, C: 2, Eb: 3, F: 4 };
  const SONG = {
    bpm: 88,
    drums: [groove(), groove(), groove(), turn()],
    bass: [
      [n(0, 8, Bn.C), n(8, 4, Bn.C), n(12, 4, Bn.G)],
      [n(0, 8, Bn.Ab), n(8, 4, Bn.Ab), n(12, 4, Bn.G)],
      [n(0, 8, Bn.Eb), n(8, 4, Bn.Eb), n(12, 4, Bn.F)],
      [n(0, 8, Bn.Bb), n(8, 4, Bn.Bb), n(12, 4, Bn.G)],
    ],
    chords: ['home', 'warm', 'bright', 'lift'],
    melody: [
      [n(0, 4, Tn.C), n(4, 8, Tn.Eb), n(12, 4, Tn.F)],
      [n(4, 4, Tn.Eb), n(8, 8, Tn.Bb)],
      [n(0, 4, Tn.C), n(4, 8, Tn.Eb), n(12, 4, Tn.F)],
      [n(4, 4, Tn.Eb), n(8, 8, Tn.C)],
    ],
    sections: [{ name: 'Intro', bars: 4 }, { name: 'Verse', bars: 8 }, { name: 'Break', bars: 4 }, { name: 'Chorus', bars: 8 }, { name: 'Outro', bars: 4 }],
    arr: { drums: [0, 1, 0, 1, 1], bass: [1, 1, 1, 1, 0], chords: [1, 1, 1, 1, 1], melody: [0, 1, 1, 1, 0] },
  };
  const MOODS = {
    home: { pcs: [0, 3, 7], color: 'oklch(56% 0.17 268)' }, warm: { pcs: [8, 0, 3], color: 'oklch(70% 0.15 58)' },
    bright: { pcs: [3, 7, 10], color: 'oklch(80% 0.14 92)' }, lift: { pcs: [10, 2, 5], color: 'oklch(66% 0.12 166)' },
    longing: { pcs: [5, 8, 0], color: 'oklch(60% 0.15 315)' }, restless: { pcs: [7, 10, 2], color: 'oklch(60% 0.17 18)' },
  };
  const MOOD_ORDER = ['home', 'warm', 'bright', 'lift', 'longing', 'restless'];
  const LADDER = { bass: [36, 39, 41, 43, 44, 46], melody: [67, 70, 72, 75, 77, 79] };
  const HOME_ROW = { bass: 0, melody: 2 };
  const voicing = (m) => MOODS[m].pcs.map((pc) => (60 + pc > 66 ? 48 + pc : 60 + pc)).sort((a, b) => a - b);
  const rootRow = (m) => LADDER.bass.findIndex((x) => x % 12 === MOODS[m].pcs[0]);
  const clone = (x) => JSON.parse(JSON.stringify(x));

  // The player has rebuilt every part exactly: their song starts as the song.
  const fresh = () => ({ drums: clone(SONG.drums), bass: clone(SONG.bass), chords: clone(SONG.chords), melody: clone(SONG.melody) });
  let mine = fresh();

  // -- the screens: one Make it yours level per world, and the end --
  const SCREENS = {
    pulse: {
      tab: 'Pulse \u00b7 Your fill', world: 'Pulse', color: 'oklch(64.5% 0.167 35.5)', dots: 5,
      title: 'Your fill', goal: 'Make bar 4 lead back your way.', part: 'drums', bars: [3], open: 3, partner: [],
      name: 'A variation', named: 'The same turn, played your way. Gold is yours.',
      why: 'Write the fill you just found by ear, your way. The twist was the best moment of the playtest; now it is yours to make. <b>Franklin</b> rebuilt essays, then rewrote them; the pleasure came from improving on the model.',
    },
    color: {
      tab: 'Color \u00b7 Your colours', world: 'Color', color: 'oklch(58% 0.12 158.8)', dots: 1,
      title: 'Your colours', goal: 'Change a bar\u2019s colour. Hear the mood move.', part: 'chords', bars: [0, 1, 2, 3], open: 2, partner: ['bass'],
      name: 'A new mood', named: 'Your colour, and the bass moved with it to its root.',
      why: 'Choosing a colour teaches more than guessing one: chords are the hardest layer to hear in a mix. The bass follows the new root, so the change sounds right. <b>Use, modify, create</b>: the copy is the starting point, not the end.',
    },
    voice: {
      tab: 'Voice \u00b7 Your answer', world: 'Voice', color: 'oklch(47.1% 0.198 269.9)', dots: 3,
      title: 'Your answer', goal: 'Answer bar 1 your way. End on the ring.', part: 'melody', bars: [1, 3], open: 1, partner: ['chords'],
      name: 'Call and response', named: 'The song asks, you answer, and it still lands home.',
      why: 'Bars 1 and 3 are the song&rsquo;s call; bars 2 and 4 are your reply. A new tune over the song&rsquo;s own chords is how jazz players began writing (a <b>contrafact</b>). Takes are the sparring partner: suggestions only once you are making, never while you copy.',
    },
    song: {
      tab: 'Your song', world: 'Story', color: 'oklch(66% 0.14 72)', dots: 1,
      why: 'Only now is &ldquo;yours&rdquo; true, and only where it is gold. Copying is &ldquo;not mine&rdquo;; changing it makes it &ldquo;partly mine&rdquo; (<b>PRIMM</b>). Next: a second song, then a blank page.',
    },
  };
  const ORDER = ['pulse', 'color', 'voice', 'song'];
  const LANES = ['hat', 'snare', 'kick'];
  const LANE_NAME = { hat: 'Hi-hat', snare: 'Snare', kick: 'Kick' };

  const st = { screen: 'pulse', bar: 3, listen: 'mine', close: false, scope: 'one', slow: false, kept: {}, history: [], at: 0 };

  // -- what changed: gold is anything that is not the song's --
  const sameNote = (a, b) => a.at === b.at && a.len === b.len && a.row === b.row;
  const drumGold = (bar, lane, s) => mine.drums[bar][lane][s] && !SONG.drums[bar][lane][s];
  const drumGone = (bar, lane, s) => !mine.drums[bar][lane][s] && SONG.drums[bar][lane][s];
  const noteGold = (part, bar, x) => !SONG[part][bar].some((y) => sameNote(x, y));
  const notesGone = (part, bar) => SONG[part][bar].filter((y) => !mine[part][bar].some((x) => sameNote(x, y)));
  function changedIn(part, bar) {
    if (part === 'drums') return LANES.some((l) => mine.drums[bar][l].some((v, s) => v !== SONG.drums[bar][l][s]));
    if (part === 'chords') return mine.chords[bar] !== SONG.chords[bar];
    return JSON.stringify(mine[part][bar]) !== JSON.stringify(SONG[part][bar]);
  }
  const changes = (part) => {
    let c = 0;
    for (let b = 0; b < BARS; b++) {
      if (part === 'drums') LANES.forEach((l) => mine.drums[b][l].forEach((v, s) => { if (v !== SONG.drums[b][l][s]) c++; }));
      else if (part === 'chords') { if (mine.chords[b] !== SONG.chords[b]) c++; }
      else c += mine[part][b].filter((x) => noteGold(part, b, x)).length + notesGone(part, b).length;
    }
    return c;
  };
  const met = () => {
    const sc = SCREENS[st.screen];
    if (st.screen === 'voice') {
      const last = mine.melody[3][mine.melody[3].length - 1];
      return (changedIn('melody', 1) || changedIn('melody', 3)) && mine.melody[1].length > 0 && last && last.row === HOME_ROW.melody;
    }
    return sc.bars.some((b) => changedIn(sc.part, b));
  };

  // -- sound --
  const owned = { drums: 'drums', bass: 'bass', chords: 'chords', melody: 'melody' };
  function eventsAt(bar, s, sec, focus, close, partner, src) {
    const on = (p) => !close || p === focus || partner.includes(p) || (focus === 'drums' && p === 'drums');
    const from = (p) => (p === focus && st.listen === 'song' ? SONG : src);
    const out = [];
    if (on('drums')) {
      const d = from('drums').drums[bar];
      for (const l of ['kick', 'snare', 'hat']) if (d[l][s]) out.push({ v: l, vel: 1, delay: l === 'snare' && d.kick[s] ? 0.03 : 0 });
    }
    if (s === 0 && on('chords')) {
      const m = from('chords').chords[bar];
      if (m) voicing(m).forEach((midi, i) => { out.push({ v: 'keys', midi, dur: STEPS * sec - 0.04, delay: i * 0.014 }); out.push({ v: 'pad', midi, dur: STEPS * sec }); });
    }
    for (const p of ['bass', 'melody']) {
      if (!on(p)) continue;
      const x = from(p)[p][bar].find((y) => y.at === s);
      if (x) out.push({ v: p === 'bass' ? 'bass' : 'lead', midi: LADDER[p][x.row], dur: x.len * sec - 0.02 });
    }
    return out;
  }
  const loopPlayer = NS.player({
    bpm: SONG.bpm, steps: STEPS * BARS, loops: 0,
    events: (pos, sec, count) => {
      const sc = SCREENS[st.screen];
      const bar = st.scope === 'one' ? st.bar : Math.floor(count / STEPS) % BARS;
      return eventsAt(bar, count % STEPS, sec, sc.part, st.close, sc.partner, mine);
    },
    onStep: (pos, count) => needle(st.scope === 'one' ? st.bar : Math.floor(count / STEPS) % BARS, count % STEPS),
    onStop: () => { needle(-1, 0); paintPlay(); },
  });
  const SONG_STEPS = SONG.sections.reduce((a, x) => a + x.bars, 0) * STEPS;
  const sectionOf = (bar) => { let e = 0; for (let i = 0; i < SONG.sections.length; i++) { e += SONG.sections[i].bars; if (bar < e) return i; } return 4; };
  const songPlayer = NS.player({
    bpm: SONG.bpm, steps: SONG_STEPS, loops: 1,
    events: (pos, sec) => {
      const bar = Math.floor(pos / STEPS), sec2 = sectionOf(bar), s = pos % STEPS;
      const src = st.listen === 'song' ? SONG : mine;
      const all = eventsAt(bar % BARS, s, sec, null, false, [], src);
      const partOf = { kick: 'drums', snare: 'drums', hat: 'drums', keys: 'chords', pad: 'chords', bass: 'bass', lead: 'melody' };
      return all.filter((e) => SONG.arr[partOf[e.v]][sec2]);
    },
    onStep: (pos) => { st.at = pos; const r = document.querySelector('.ribbon'); if (r) r.style.setProperty('--p', String(pos / (SONG_STEPS - 1))); const t = document.querySelector('.time span'); if (t) t.textContent = clock(pos); },
    onStop: () => paintPlay(),
  });
  const clock = (pos) => { const s = pos * (60 / SONG.bpm / 4); return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
  const player = () => (st.screen === 'song' ? songPlayer : loopPlayer);
  function setTempo() { loopPlayer.bpm = st.slow ? Math.round(SONG.bpm * 0.75) : SONG.bpm; }

  function hearPad(lane) { NS.play(lane, { vel: 1 }); }
  function hearNote(part, row, beats) { NS.play(part === 'bass' ? 'bass' : 'lead', { midi: LADDER[part][row], dur: beats * 60 / SONG.bpm }); }
  function hearChord(m) { voicing(m).forEach((midi, i) => { NS.play('keys', { midi, dur: 1.6, delay: 0 }, NS.now() + 0.01 + i * 0.014); NS.play('pad', { midi, dur: 1.8 }); }); }

  // -- edits --
  function edit(fn) {
    st.history.push(clone(mine));
    fn();
    if (st.screen !== 'song') st.listen = 'mine';
    render();
  }
  function undo() { if (st.history.length) { mine = st.history.pop(); render(); } }
  function backToSong() {
    const sc = SCREENS[st.screen];
    edit(() => { for (const b of sc.bars) { mine[sc.part][b] = clone(SONG[sc.part][b]); if (sc.part === 'chords') mine.bass[b] = clone(SONG.bass[b]); } });
  }

  // The sparring partner: three takes on the bar on screen, made from what is there now.
  const rnd = (k) => Math.floor(Math.random() * k);
  const TAKES = {
    drums: {
      Busier: (d) => { d.hat = hits([0, 2, 4, 6, 8, 10, 12, 13, 14, 15]); d.snare = hits([4, 11, 12, 13, 14, 15]); },
      Emptier: (d) => { d.hat = hits([0, 4, 8, 12]); d.snare = hits([4]); d.kick = hits([0, 8]); },
      Surprise: (d) => {
        const fills = [{ snare: [4, 10, 13, 14, 15], kick: [0, 4, 8, 11] }, { snare: [4, 12, 13], kick: [0, 4, 8, 10, 14] },
          { snare: [4, 9, 12, 15], kick: [0, 4, 6, 8, 14] }, { snare: [4, 12, 14], kick: [0, 3, 8, 11, 15] }];
        const f = fills[rnd(fills.length)];
        d.snare = hits(f.snare); d.kick = hits(f.kick); d.hat = hits([0, 2, 4, 6, 8, 10, 12]);
      },
    },
    melody: {
      Busier: (ns, bar) => { const out = []; for (const x of ns) { if (x.len >= 8) { out.push(n(x.at, 4, x.row), n(x.at + 4, x.len - 4, Math.max(0, x.row - 1))); } else out.push(x); } return land(out, bar); },
      Emptier: (ns, bar) => land([n(4, 12, ns.length ? ns[0].row : 3)], bar),
      Surprise: (ns, bar) => {
        const shapes = [[[0, 4], [4, 4], [8, 8]], [[4, 8], [12, 4]], [[0, 8], [8, 4], [12, 4]], [[2, 2], [4, 4], [8, 8]]];
        let row = 1 + rnd(4);
        return land(shapes[rnd(shapes.length)].map(([at, len]) => { row = Math.max(0, Math.min(5, row + rnd(3) - 1)); return n(at, len, row); }), bar);
      },
    },
  };
  /** An answer that ends the song lands home. */
  function land(ns, bar) { if (bar === 3 && ns.length) ns[ns.length - 1] = { ...ns[ns.length - 1], row: HOME_ROW.melody }; return ns; }
  function take(kind) {
    const sc = SCREENS[st.screen];
    edit(() => {
      if (sc.part === 'drums') TAKES.drums[kind](mine.drums[st.bar]);
      else mine.melody[st.bar] = TAKES.melody[kind](clone(mine.melody[st.bar]), st.bar);
    });
    if (!player().playing) { st.scope = 'one'; player().start(); paintPlay(); }
  }

  // -- drawing --
  const $ = (id) => document.getElementById(id);
  const icon = (id, cls = 'i') => '<svg class="' + cls + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const STITCH = {
    kick: '<svg class="stitch" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="13" width="30" height="14" rx="7" fill="currentColor"/></svg>',
    snare: '<svg class="stitch" viewBox="0 0 40 40" aria-hidden="true"><path d="M8.5 12.7l3.5-3.6 8 8 8-8 3.5 3.6-8 8 8 8-3.5 3.5-8-8-8 8-3.5-3.5 8-8z" fill="currentColor"/></svg>',
    hat: '<svg class="stitch" viewBox="0 0 40 40" aria-hidden="true"><path d="M10.5 30.2L25 7.5a2.6 2.6 0 0 1 4.4 2.8L14.9 33a2.6 2.6 0 0 1-4.4-2.8z" fill="currentColor"/></svg>',
  };

  function titlebar() {
    const sc = SCREENS[st.screen];
    const dots = st.screen === 'song' ? '' : Array.from({ length: sc.dots }, () => '<i class="jn"></i>').join('') + '<i class="jn mine here" title="Make it yours"></i>';
    const playing = player().playing;
    return '<div class="titlebar"><div class="tb-left"><span class="lights"><i></i><i></i><i></i></span><span class="tb-btns">' +
      '<span class="bar-btn">' + icon('left') + 'Back</span><span class="bar-btn">' + icon('home') + 'Home</span></span></div>' +
      '<div class="journey" style="--world:' + sc.color + '">' + (st.screen === 'song' ? '' : '<span class="arrow">' + icon('left') + '</span><b>' + sc.world + '</b>' + dots + '<span class="arrow">' + icon('right') + '</span>') + '</div>' +
      '<div class="tb-right"><span class="status' + (playing ? ' on' : '') + '"><i></i>' + (playing ? 'Playing' : 'Sound ready') + '</span><span class="bar-btn">Sync</span></div></div>';
  }

  function miniBar(bar) {
    const at = (r, c) => 'style="grid-row:' + r + ';grid-column:' + c + '"';
    let h = '';
    for (const [p, r] of [['melody', 1], ['bass', 3]]) for (const x of mine[p][bar]) h += '<i class="m-line c-' + p + (noteGold(p, bar, x) ? ' gold' : '') + '" ' + at(r, (x.at + 1) + ' / span ' + x.len) + '></i>';
    const m = mine.chords[bar];
    h += '<i class="m-chord' + (m !== SONG.chords[bar] ? ' gold' : '') + '" style="grid-row:2;background:' + MOODS[m].color + '"></i>';
    LANES.forEach((l, i) => mine.drums[bar][l].forEach((on, s) => { if (on) h += '<i class="m-hit m-' + l + ' c-' + l + (drumGold(bar, l, s) ? ' gold' : '') + '" ' + at(4 + i, s + 1) + '></i>'; }));
    return '<span class="mini">' + h + '</span>';
  }
  function strip(sc) {
    let tiles = '';
    for (let b = 0; b < BARS; b++) {
      const locked = !sc.bars.includes(b);
      tiles += '<button type="button" class="tile" data-bar="' + b + '"' + (b === st.bar ? ' aria-current="true"' : '') + (locked ? ' data-locked' : '') +
        (BARS && [...ORDER.slice(0, 3)].some((k) => changedIn(SCREENS[k].part, b)) ? ' data-changed' : '') + '>' +
        '<span class="tile-top"><span>Bar ' + (b + 1) + '</span><i class="patch" title="Something here is yours"></i></span>' + miniBar(b) + '<i class="needle"></i></button>';
    }
    const can = (d) => sc.bars.includes(st.bar + d);
    return '<div class="stripwrap"><button type="button" class="sarrow" data-step="-1"' + (can(-1) ? '' : ' disabled') + ' aria-label="Bar before">' + icon('left') + '</button>' +
      '<nav class="strip">' + tiles + '</nav><button type="button" class="sarrow" data-step="1"' + (can(1) ? '' : ' disabled') + ' aria-label="Bar after">' + icon('right') + '</button></div>';
  }
  function head(sc) {
    const ok = met();
    const c = changes(sc.part);
    const tag = '<span class="changes"' + (c ? '' : ' data-none') + '>' + (c ? c + (c === 1 ? ' change' : ' changes') : 'No changes yet') + '</span>';
    return '<header class="head"><h1>' + sc.title + '</h1><p class="goal' + (ok ? ' named' : '') + '">' +
      '<span class="side">' + (ok ? '<span class="tick">' + icon('check') + '</span>' : '') + '</span>' +
      (ok ? '<span class="text"><b>' + sc.name + '.</b> ' + sc.named + '</span>' : '<span class="text">' + sc.goal + '</span>') +
      '<span class="side">' + tag + '</span></p></header>';
  }
  function tools(sc) {
    const takes = sc.part === 'chords' ? '' :
      '<div class="takes"><span class="takes-label">' + icon('spark') + 'Try a take</span>' +
      ['Busier', 'Emptier', 'Surprise'].map((k) => '<button type="button" class="chip" data-take="' + k + '">' + k + '</button>').join('') + '</div>';
    return '<div class="tools"><span></span>' + (takes || '<span></span>') +
      '<div class="edit"><button type="button" class="sbtn" data-act="undo"' + (st.history.length ? '' : ' disabled') + '>' + icon('undo') + 'Undo</button>' +
      '<button type="button" class="sbtn" data-act="reset"' + (changes(sc.part) ? '' : ' disabled') + '>Back to the song&rsquo;s</button></div></div>';
  }
  function drumBar() {
    const b = st.bar, s16 = Array.from({ length: STEPS }, (_, i) => i);
    const sub = ['', 'e', '&amp;', 'a'];
    let h = '<div class="drumbar"><div class="lane"><span></span><div class="beats">' +
      [0, 1, 2, 3].map((k) => '<div class="beat">' + [0, 1, 2, 3].map((j) => '<span class="beatno" data-col="' + (k * 4 + j) + '"' + (j ? ' data-sub' : '') + '>' + (j ? sub[j] : k + 1) + '</span>').join('') + '</div>').join('') + '</div></div>';
    for (const l of LANES) {
      h += '<div class="lane c-' + l + '"><span class="name">' + LANE_NAME[l] + '</span><div class="beats">' +
        [0, 1, 2, 3].map((k) => '<div class="beat">' + s16.slice(k * 4, k * 4 + 4).map((s) => {
          const on = mine.drums[b][l][s];
          return '<button type="button" class="pad" data-lane="' + l + '" data-step="' + s + '" data-col="' + s + '"' + (on ? ' data-on' : '') +
            (drumGold(b, l, s) ? ' data-gold' : '') + (drumGone(b, l, s) ? ' data-gone title="The song\u2019s, taken out"' : '') + ' aria-pressed="' + on + '">' + (on ? STITCH[l] : '') + '</button>';
        }).join('') + '</div>').join('') + '</div></div>';
    }
    return h + '</div>';
  }
  function noteBar(part) {
    const b = st.bar, sc = SCREENS[st.screen];
    const locked = !sc.bars.includes(b);
    const top = [5, 4, 3, 2, 1, 0];
    let cells = '';
    for (const r of top) for (let c = 0; c < 4; c++) cells += '<span class="cell" data-col="' + (c * 4) + '" style="grid-row:' + (6 - r) + ';grid-column:' + (c + 1) + '"></span>';
    const mark = (x, extra) => '<span class="note" data-at="' + x.at + '"' + extra + ' style="grid-row:' + (6 - x.row) + ';grid-column:' + (x.at / 4 + 1) + ' / span ' + Math.max(1, x.len / 4) + '"><i class="knot"></i></span>';
    const gone = notesGone(part, b).map((x) => mark(x, ' data-gone')).join('');
    const ns = mine[part][b].map((x) => mark(x, noteGold(part, b, x) ? ' data-gold' : '')).join('');
    const mood = mine.chords[b];
    return '<div class="notebar c-' + part + '"><div class="row"><span class="name">Tune</span><div class="cols">' +
      [0, 1, 2, 3].map((k) => '<span class="beatno" data-col="' + (k * 4) + '">' + (k + 1) + '</span>').join('') + '</div></div>' +
      '<div class="row"><span class="name small">Color</span><span class="ctx-mood" style="background:' + MOODS[mood].color + '"></span></div>' +
      '<div class="ladder"><div class="heights">' + top.map((r) => '<span class="height"' + (r === HOME_ROW[part] ? ' data-home' : '') + ' style="--d:' + ((6 - r) / 6) + '"><i></i></span>').join('') + '</div>' +
      '<div class="cells" id="cells"' + (locked ? ' data-locked title="The song\u2019s call: answer it in bars 2 and 4"' : '') + '>' + cells + gone + ns + '</div></div></div>';
  }
  function chordBar() {
    const b = st.bar, m = mine.chords[b];
    const lines = mine.bass[b].map((x) => '<span class="bassline"' + (noteGold('bass', b, x) ? ' data-gold' : '') + ' style="grid-column:' + (x.at + 1) + ' / span ' + x.len + ';--h:' + ((LADDER.bass[x.row] - LADDER.bass[0]) / 12) + '"></span>').join('');
    return '<div class="chordbar"><span class="name">Chords</span><div class="ruler">' + [0, 1, 2, 3].map((k) => '<span class="beatno" data-col="' + (k * 4) + '">' + (k + 1) + '</span>').join('') + '</div>' +
      '<button type="button" class="block" data-act="hear-block"' + (m !== SONG.chords[b] ? ' data-gold' : '') + ' style="--mood:' + MOODS[m].color + '" aria-label="Hear this bar\u2019s colour"></button>' +
      '<span class="name small">Bass</span><div class="under">' + lines + '</div>' +
      '<div class="palette" role="radiogroup" aria-label="Colours">' + MOOD_ORDER.map((k) => '<button type="button" class="swatch" role="radio" data-mood="' + k + '" aria-checked="' + (k === m) + '"' +
      (k === SONG.chords[b] ? ' data-song title="The song\u2019s colour for this bar"' : '') + ' style="--mood:' + MOODS[k].color + '"></button>').join('') + '</div></div>';
  }
  function dock(sc) {
    const playing = player().playing;
    const keep = met() && !st.kept[st.screen];
    const next = ORDER[ORDER.indexOf(st.screen) + 1];
    return '<div class="dock"><div class="listens"><div class="ab" role="radiogroup" aria-label="Listen to">' +
      [['song', 'The song'], ['mine', 'Yours']].map(([id, l]) => '<button type="button" class="seg" role="radio" data-listen="' + id + '" aria-checked="' + (st.listen === id) + '">' + l + '</button>').join('') + '</div>' +
      '<button type="button" class="seg toggle" data-act="close" aria-pressed="' + st.close + '">' + icon('close') + 'Up close</button></div>' +
      '<div class="transport"><div class="scope" role="radiogroup" aria-label="Loop">' + icon('loop') +
      [['one', 'Bar ' + (st.bar + 1)], ['all', 'All 4 bars']].map(([id, l]) => '<button type="button" class="seg" role="radio" data-scope="' + id + '" aria-checked="' + (st.scope === id) + '">' + l + '</button>').join('') + '</div>' +
      '<button type="button" class="play" data-act="play" aria-label="' + (playing ? 'Stop' : 'Play') + '">' + icon(playing ? 'pause' : 'play', '') + '</button>' +
      '<button type="button" class="seg toggle" data-act="slow" aria-pressed="' + st.slow + '">' + icon('slow') + 'Slow</button></div>' +
      '<div class="way">' + (keep ? '<button type="button" class="sbtn gold" data-act="keep">Keep it</button>' :
        st.kept[st.screen] ? '<button type="button" class="sbtn primary" data-go="' + next + '">' + (next === 'song' ? 'Hear your song' : 'Next') + icon('arrow') + '</button>' : '') + '</div></div>';
  }
  function endScreen() {
    const playing = songPlayer.playing;
    const parts = [['drums', 'Drums'], ['bass', 'Bass'], ['chords', 'Chords'], ['melody', 'Tune']];
    const any = parts.some(([p]) => [0, 1, 2, 3].some((b) => changedIn(p, b)));
    let map = '<span></span>' + [1, 2, 3, 4].map((b) => '<span class="bn">Bar ' + b + '</span>').join('');
    for (const [p, l] of parts) map += '<span class="rn">' + l + '</span>' + [0, 1, 2, 3].map((b) => '<span class="cell2"' + (changedIn(p, b) ? ' data-gold' : '') + '></span>').join('');
    return '<section class="end"><p class="kicker">Story, complete</p><h1>' + (any ? 'Your song' : 'The song, rebuilt') + '</h1>' +
      '<p class="line">' + (any ? 'The song, with your changes in it. Gold is yours.' : 'Nothing changed yet: it is still the song.') + '</p>' +
      '<div class="player"><button type="button" class="play" data-act="play" aria-label="' + (playing ? 'Pause' : 'Play') + '">' + icon(playing ? 'pause' : 'play', '') + '</button>' +
      '<div class="ribbon" style="--p:' + (st.at / (SONG_STEPS - 1)) + '"><i class="sewn"></i><i class="head-mark"></i></div>' +
      '<p class="time"><span>' + clock(st.at) + '</span> / ' + clock(SONG_STEPS) + '</p></div>' +
      '<div class="ab" role="radiogroup" aria-label="Listen to">' + [['song', 'The song'], ['mine', 'Yours']].map(([id, l]) => '<button type="button" class="seg" role="radio" data-listen="' + id + '" aria-checked="' + (st.listen === id) + '">' + l + '</button>').join('') + '</div>' +
      '<div class="map" aria-label="Where it is yours">' + map + '</div></section>';
  }

  function render() {
    const sc = SCREENS[st.screen];
    $('tabs').innerHTML = ORDER.map((k) => '<button type="button" class="tab" role="tab" data-go="' + k + '" aria-selected="' + (k === st.screen) + '">' + SCREENS[k].tab + '</button>').join('');
    $('why').innerHTML = sc.why;
    let body;
    if (st.screen === 'song') body = '<div class="school ending">' + endScreen() + '</div>';
    else {
      const inst = sc.part === 'drums' ? drumBar() : sc.part === 'chords' ? chordBar() : noteBar(sc.part);
      body = '<div class="school">' + head(sc) + strip(sc) + tools(sc) + '<section class="cloth" aria-label="Instrument">' + inst + '</section>' + dock(sc) + '</div>';
    }
    $('app').innerHTML = titlebar() + body;
    $('app').style.setProperty('--world', sc.color);
    bindCells();
  }
  function paintPlay() {
    document.querySelectorAll('.play').forEach((b) => { const on = player().playing; b.setAttribute('aria-label', on ? 'Stop' : 'Play'); b.innerHTML = icon(on ? 'pause' : 'play', ''); });
    const s = document.querySelector('.status'); if (s) { s.classList.toggle('on', player().playing); s.lastChild.textContent = player().playing ? 'Playing' : 'Sound ready'; }
  }
  function needle(bar, step) {
    document.querySelectorAll('[data-now]').forEach((e) => e.removeAttribute('data-now'));
    if (bar < 0) return;
    const t = document.querySelector('.tile[data-bar="' + bar + '"]');
    if (t) { t.setAttribute('data-now', ''); t.style.setProperty('--at', String(step / STEPS)); }
    if (bar !== st.bar) return;
    const sc = SCREENS[st.screen];
    const col = sc.part === 'drums' ? step : Math.floor(step / 4) * 4;
    document.querySelectorAll('.cloth [data-col="' + col + '"]').forEach((e) => e.setAttribute('data-now', ''));
    document.querySelectorAll('.note[data-at="' + step + '"]').forEach((e) => { e.setAttribute('data-hit', ''); setTimeout(() => e.removeAttribute('data-hit'), 160); });
  }

  // -- presses: on pointerdown, like the app --
  function go(screen) {
    loopPlayer.stop(); songPlayer.stop();
    st.screen = screen; const sc = SCREENS[screen];
    st.bar = sc.open ?? 0; st.listen = 'mine'; st.close = false; st.scope = 'one'; st.history = []; st.at = 0;
    render();
  }
  function onPress(e) {
    if (e.button !== 0) return;
    const el = e.target.closest('button');
    if (!el || el.disabled) return;
    e.preventDefault();
    NS.start();
    const sc = SCREENS[st.screen];
    const d = el.dataset;
    if (d.go) return go(d.go);
    if (d.take) return take(d.take);
    if (d.listen) {
      const p = player();
      if (p.playing && st.listen === d.listen) { p.stop(); paintPlay(); return; }
      st.listen = d.listen; render();
      if (!p.playing) { p.start(st.screen === 'song' ? st.at : 0); paintPlay(); }
      return;
    }
    if (d.scope) { st.scope = d.scope; render(); return; }
    if (d.bar !== undefined && el.classList.contains('tile')) { if (!el.hasAttribute('data-locked')) { st.bar = Number(d.bar); render(); } return; }
    if (d.step !== undefined && el.classList.contains('sarrow')) { st.bar += Number(d.step); render(); return; }
    if (d.lane) {
      const s = Number(d.step);
      edit(() => { mine.drums[st.bar][d.lane][s] = !mine.drums[st.bar][d.lane][s]; });
      if (mine.drums[st.bar][d.lane][s]) hearPad(d.lane);
      return;
    }
    if (d.mood) {
      const b = st.bar;
      if (mine.chords[b] === d.mood) { hearChord(d.mood); return; }
      edit(() => {
        mine.chords[b] = d.mood;
        // The floor follows the colour: the bass moves to the new chord's root, its rhythm unchanged.
        const r = rootRow(d.mood);
        mine.bass[b] = d.mood === SONG.chords[b] ? clone(SONG.bass[b]) : mine.bass[b].map((x, i) => (i < 2 ? { ...x, row: r } : x));
      });
      hearChord(d.mood);
      return;
    }
    switch (d.act) {
      case 'play': {
        const p = player();
        if (p.playing) p.stop(); else p.start(st.screen === 'song' ? (st.at >= SONG_STEPS - 1 ? 0 : st.at) : 0);
        paintPlay(); return;
      }
      case 'close': st.close = !st.close; render(); if (st.close && !loopPlayer.playing) { loopPlayer.start(); paintPlay(); } return;
      case 'slow': st.slow = !st.slow; setTempo(); render(); return;
      case 'undo': undo(); return;
      case 'reset': backToSong(); return;
      case 'keep': st.kept[st.screen] = true; render(); return;
      case 'hear-block': hearChord(mine.chords[st.bar]); return;
    }
  }
  document.addEventListener('pointerdown', onPress);
  document.addEventListener('click', (e) => { if (e.detail === 0) onPress({ button: 0, target: e.target, preventDefault() {} }); });

  // Notes: press an empty beat to place a note, drag right to hold it, press a note and let go to take it away.
  let drag = null;
  function bindCells() {
    const cells = $('cells');
    if (!cells || cells.hasAttribute('data-locked')) return;
    const where = (e) => {
      const r = cells.getBoundingClientRect();
      const c = Math.max(0, Math.min(3, Math.floor(((e.clientX - r.left) / r.width) * 4)));
      const row = Math.max(0, Math.min(5, 5 - Math.floor(((e.clientY - r.top) / r.height) * 6)));
      return { at: c * 4, row };
    };
    cells.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault(); e.stopPropagation(); NS.start();
      cells.setPointerCapture(e.pointerId);
      const { at, row } = where(e);
      const ns = mine.melody[st.bar];
      const hit = ns.find((x) => x.row === row && x.at <= at && at < x.at + x.len);
      if (hit) { drag = { grab: hit.at, moved: false }; hearNote('melody', hit.row, hit.len / 4); return; }
      edit(() => { mine.melody[st.bar] = ns.filter((x) => !(x.at === at || (x.at < at && x.at + x.len > at))).concat([n(at, 4, row)]).sort((a, b) => a.at - b.at); });
      drag = { at, row, len: 4 };
      hearNote('melody', row, 1);
      bindCells();
    });
    cells.addEventListener('pointermove', (e) => {
      if (!drag || drag.grab !== undefined) return;
      const { at } = where(e);
      const len = Math.max(4, at + 4 - drag.at);
      if (len === drag.len) return;
      drag.len = len;
      const ns = mine.melody[st.bar].filter((x) => x.at === drag.at || x.at + x.len <= drag.at || x.at >= drag.at + len);
      mine.melody[st.bar] = ns.map((x) => (x.at === drag.at ? { ...x, len } : x));
      render();
    });
    cells.addEventListener('pointerup', () => {
      if (drag && drag.grab !== undefined && !drag.moved) { const g = drag.grab; edit(() => { mine.melody[st.bar] = mine.melody[st.bar].filter((x) => x.at !== g); }); }
      drag = null;
    });
  }

  addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); onPress({ button: 0, target: document.querySelector('.play'), preventDefault() {} }); } });
  render();
})();
</script>
